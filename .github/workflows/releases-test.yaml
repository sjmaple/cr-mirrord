name: Release Monitor

on:
  schedule:
    # Every 5 minutes (for testing)
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

# The notify job reads the previous run's conclusion as the last known status, so runs
# must not overlap.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================
  # 1) Check latest GitHub Release has all required assets
  # ============================================================
  check_latest_release:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      tag: ${{ steps.check.outputs.tag }}
      html_url: ${{ steps.check.outputs.html_url }}
      error: ${{ steps.check.outputs.error }}
    steps:
      - name: Check latest GitHub Release assets
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;

            // === REQUIRED ASSETS ===
            // These must exist on every production release.
            const requiredAssets = [
              // Linux x86_64
              "mirrord_linux_x86_64.zip",
              "mirrord_linux_x86_64.shasum256",
              "mirrord_linux_x86_64",
              "libmirrord_layer_linux_x86_64.so",

              // Linux aarch64
              "mirrord_linux_aarch64.zip",
              "mirrord_linux_aarch64.shasum256",
              "mirrord_linux_aarch64",
              "libmirrord_layer_linux_aarch64.so",

              // macOS universal
              "mirrord_mac_universal.zip",
              "mirrord_mac_universal.shasum256",
              "mirrord_mac_universal",
              "libmirrord_layer_mac_universal.dylib",

              // Windows
              "mirrord.exe",
              "mirrord.exe.sha256",
              "mirrord_layer_win.dll",
              "mirrord_layer_win.dll.sha256",
              "mirrord.msi",
              "mirrord.msi.sha256"
            ];

            core.info(`Checking latest release for ${owner}/${repo}...`);

            let release;
            try {
              const res = await github.rest.repos.getLatestRelease({ owner, repo });
              release = res.data;
            } catch (error) {
              const msg = `Failed to get latest release: ${error.message}`;
              core.warning(msg);
              core.setOutput("ok", "false");
              core.setOutput("error", msg);
              core.setOutput("tag", "");
              core.setOutput("html_url", "");
              core.setOutput("missing_required", "");
              return;
            }

            const tag = release.tag_name;
            const htmlUrl = release.html_url;
            const assetNames = release.assets.map(a => a.name);
            core.info(`Latest release tag: ${tag}`);
            core.info(`Assets on release: ${assetNames.join(", ") || "(none)"}`);

            const missingRequired = requiredAssets.filter(name => !assetNames.includes(name));

            core.setOutput("tag", tag);
            core.setOutput("html_url", htmlUrl);
            core.setOutput("missing_required", missingRequired.join(", "));

            if (missingRequired.length > 0) {
              const msg = `Missing REQUIRED assets on latest release ${tag}: ${missingRequired.join(", ")}`;
              core.warning(msg);
              core.setOutput("ok", "false");
              core.setOutput("error", msg);
            } else {
              core.info("All required assets are present on latest release.");
              core.setOutput("ok", "true");
              core.setOutput("error", "");
            }

      - name: Fail on missing required assets
        if: steps.check.outputs.ok != 'true'
        run: exit 1

      - name: Log success
        if: steps.check.outputs.ok == 'true'
        shell: bash
        run: |
          echo "✅ Release monitor: all required assets are present on latest release."


  # ============================================================
  # 2) Install-path tests (curl|bash + Homebrew) on Linux & macOS
  # ============================================================
  test_install_paths:
    needs: check_latest_release
    strategy:
      fail-fast: false
      matrix:
        os: [blacksmith-4vcpu-ubuntu-2404, blacksmith-6vcpu-macos-latest]
    runs-on: ${{ matrix.os }}
    # Every install attempt below is bounded, so this only catches a hang elsewhere in the job.
    # It outlasts the worst case of all attempts (two installers, three attempts of 3 minutes
    # each plus cleanup), because a job cut off by this limit reports as cancelled with no error
    # output for the alert. A hung job would otherwise hold up the serialized runs behind it for
    # hours.
    timeout-minutes: 25
    # One output per OS, since matrix legs overwrite each other's outputs of the same name.
    # Every leg evaluates both, but each is empty except on its own OS when that install
    # failed, and the runner never sets empty outputs, so a leg cannot clear the other's
    # error. See "Using job outputs in a matrix job" in the GitHub Actions workflow syntax docs.
    outputs:
      error_linux: "${{ runner.os == 'Linux' && (steps.curl.outputs.error || steps.brew_setup.outputs.error || steps.brew.outputs.error) && format('Linux: {0} {1} {2}', steps.curl.outputs.error, steps.brew_setup.outputs.error, steps.brew.outputs.error) || '' }}"
      error_macos: "${{ runner.os == 'macOS' && (steps.curl.outputs.error || steps.brew.outputs.error) && format('macOS: {0} {1}', steps.curl.outputs.error, steps.brew.outputs.error) || '' }}"
    steps:
      - name: Show env + release info
        shell: bash
        run: |
          echo "Running on OS: ${{ runner.os }} (bash $BASH_VERSION)"
          echo "Latest tag from monitor: '${{ needs.check_latest_release.outputs.tag }}'"
          echo "Release URL from monitor: '${{ needs.check_latest_release.outputs.html_url }}'"

      - name: Write the install attempt timeout helper
        shell: bash
        run: |
          # Runs a command under a wall-clock limit, like GNU `timeout`, and returns 124 when the
          # limit is hit. GNU timeout is missing on the macOS runners. A stalled installer has to
          # die together with the download it spawned, so that a retry never races a leftover
          # download, so on expiry every process the command started is killed: the job's
          # process group (a background job gets its own under `set -m`) and, since Homebrew
          # starts its subprocesses in process groups of their own, every descendant found by
          # walking parent pids.
          cat > "$RUNNER_TEMP/with_timeout.sh" <<'EOF'
          with_timeout() {
            local limit="$1"
            shift

            set -m
            "$@" &
            local pid=$!
            set +m

            local waited=0
            while jobs -rp | grep -qx "$pid"; do
              if [ "$waited" -ge "$limit" ]; then
                kill_job_tree "$pid" TERM
                for _ in 1 2 3 4 5; do
                  jobs -rp | grep -qx "$pid" || break
                  sleep 1
                done
                kill_job_tree "$pid" KILL
                wait "$pid" 2>/dev/null || true
                return 124
              fi
              sleep 1
              waited=$((waited + 1))
            done
            wait "$pid"
          }

          kill_job_tree() {
            local pid="$1" signal="$2"
            kill "-$signal" -- "-$pid" $pid $(descendants "$pid") 2>/dev/null || true
          }

          descendants() {
            local parent child
            for parent in "$@"; do
              for child in $(ps -e -o pid= -o ppid= | awk -v parent="$parent" '$2 == parent { print $1 }'); do
                echo "$child"
                descendants "$child"
              done
            done
          }
          EOF

      - name: Test curl|bash installer
        id: curl
        shell: bash
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/with_timeout.sh"
          url="https://raw.githubusercontent.com/metalbear-co/mirrord/main/scripts/install.sh"
          install_via_curl_bash() { curl -fsSL "$url" | bash; }

          # Downloads from GitHub occasionally fail or stall transiently, so each attempt gets a
          # time limit and is retried before declaring failure; a genuinely broken installer or
          # release fails every attempt. The limit is generous: the installer normally finishes
          # in seconds.
          attempt_limit=180
          echo "Installing mirrord via curl|bash from: $url"
          for attempt in 1 2 3; do
            status=0
            with_timeout "$attempt_limit" install_via_curl_bash >/tmp/install_sh.log 2>&1 || status=$?
            if [ "$status" -eq 0 ]; then
              break
            fi
            if [ "$status" -eq 124 ]; then
              echo "curl|bash install attempt ${attempt}/3 stalled and was killed after ${attempt_limit}s"
            fi
            echo "----- installer output (attempt ${attempt}/3) -----"
            cat /tmp/install_sh.log || true
            if [ "$attempt" -eq 3 ]; then
              echo "ok=false" >> "$GITHUB_OUTPUT"
              if [ "$status" -eq 124 ]; then
                echo "error=curl|bash installer failed 3 times from $url; the last attempt stalled and was killed after ${attempt_limit}s. See logs in this step." >> "$GITHUB_OUTPUT"
              else
                echo "error=curl|bash installer failed 3 times from $url. See logs in this step." >> "$GITHUB_OUTPUT"
              fi
              exit 0
            fi
            sleep 5
          done

          # Verify mirrord is on PATH and prints a version
          if ! command -v mirrord >/dev/null 2>&1; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "error=mirrord is not on PATH after curl|bash install." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! mirrord --version >/tmp/mirrord_version_curl.log 2>&1; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "error=mirrord --version failed after curl|bash install." >> "$GITHUB_OUTPUT"
            echo "----- mirrord --version output (curl) -----"
            cat /tmp/mirrord_version_curl.log || true
            exit 0
          fi

          echo "curl|bash installer succeeded. Version:"
          cat /tmp/mirrord_version_curl.log || true

          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "error=" >> "$GITHUB_OUTPUT"

      - name: Remove mirrord binary between installers
        shell: bash
        run: |
          set -euo pipefail
          BIN="$(command -v mirrord || true)"
          if [ -n "$BIN" ]; then
            echo "Removing mirrord binary at: $BIN"
            rm -f "$BIN" || true
          else
            echo "No mirrord binary found to remove."
          fi
          hash -r || true

      - name: Install Homebrew on Linux if missing
        id: brew_setup
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          # A failure here is a problem with the runner, not the release, so the alert says so.
          trap 'echo "error=Homebrew setup failed on the runner, so the brew install path was not tested." >> "$GITHUB_OUTPUT"' ERR

          # Runner images can ship Linuxbrew off PATH and owned by a user other than the job's,
          # and brew refuses to run on a prefix it cannot write to.
          if [ -d "/home/linuxbrew/.linuxbrew" ]; then
            sudo chown -R "$(id -un):$(id -gn)" /home/linuxbrew/.linuxbrew
          fi

          if [ -x "/home/linuxbrew/.linuxbrew/bin/brew" ]; then
            echo "Homebrew already installed on this Linux runner."
          else
            echo "Installing Homebrew on Linux (non-interactive)..."
            NONINTERACTIVE=1 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
          fi

          # Ensure Linuxbrew is on PATH for subsequent steps
          if [ -d "/home/linuxbrew/.linuxbrew/bin" ]; then
            echo "Adding Linuxbrew to PATH"
            {
              echo "HOMEBREW_PREFIX=/home/linuxbrew/.linuxbrew"
              echo "HOMEBREW_NO_AUTO_UPDATE=1"
              echo "HOMEBREW_NO_SANDBOX_LINUX=1"
              echo "PATH=/home/linuxbrew/.linuxbrew/bin:/home/linuxbrew/.linuxbrew/sbin:$PATH"
            } >> "$GITHUB_ENV"
          fi

      - name: Test Homebrew install (Linux + macOS)
        id: brew
        shell: bash
        run: |
          set -euo pipefail
          . "$RUNNER_TEMP/with_timeout.sh"

          if ! command -v brew >/dev/null 2>&1; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "error=Homebrew (brew) is not installed on this runner." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Linuxbrew's install occasionally aborts with a "Broken pipe" (EPIPE from
          # Homebrew's internal `ldd` linkage audit) even though the release, formula,
          # and bottle are all fine. It's a ~50% flake, so retry a few times before
          # declaring failure; a genuinely broken formula/asset fails every attempt.
          # Each attempt also gets a time limit, since the download from the release assets
          # can stall; a normal install finishes in well under a minute.
          attempt_limit=180
          echo "Installing mirrord via Homebrew: metalbear-co/mirrord/mirrord"
          for attempt in 1 2 3; do
            echo "brew install attempt ${attempt}/3"
            status=0
            with_timeout "$attempt_limit" brew install metalbear-co/mirrord/mirrord >/tmp/brew_install.log 2>&1 || status=$?
            if [ "$status" -eq 0 ]; then
              break
            fi
            if [ "$status" -eq 124 ]; then
              echo "brew install attempt ${attempt}/3 stalled and was killed after ${attempt_limit}s"
            fi
            echo "----- brew output (attempt ${attempt}) -----"
            cat /tmp/brew_install.log || true
            # Reset any partial install, and any partial tap clone, left behind by the aborted
            # attempt; a half-cloned tap makes every later attempt fail at once.
            with_timeout 60 brew uninstall --force metalbear-co/mirrord/mirrord >/dev/null 2>&1 || true
            with_timeout 60 brew untap --force metalbear-co/mirrord >/dev/null 2>&1 || true
            sleep 5
          done

          if [ "$status" -ne 0 ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            if [ "$status" -eq 124 ]; then
              echo "error=brew install metalbear-co/mirrord/mirrord failed after 3 attempts; the last attempt stalled and was killed after ${attempt_limit}s. See logs in this step." >> "$GITHUB_OUTPUT"
            else
              echo "error=brew install metalbear-co/mirrord/mirrord failed after 3 attempts. See logs in this step." >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          if ! command -v mirrord >/dev/null 2>&1; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "error=mirrord not on PATH after brew install." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! mirrord --version >/tmp/mirrord_version_brew.log 2>&1; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "error=mirrord --version failed after brew install." >> "$GITHUB_OUTPUT"
            echo "----- mirrord --version output (brew) -----"
            cat /tmp/mirrord_version_brew.log || true
            exit 0
          fi

          echo "brew install succeeded. Version:"
          cat /tmp/mirrord_version_brew.log || true

          echo "ok=true" >> "$GITHUB_OUTPUT"
          echo "error=" >> "$GITHUB_OUTPUT"

      - name: Fail on install errors
        if: steps.curl.outputs.ok != 'true' || steps.brew.outputs.ok != 'true'
        run: exit 1

      - name: Log install success
        if: steps.curl.outputs.ok == 'true' && steps.brew.outputs.ok == 'true'
        shell: bash
        run: |
          echo "✅ Install monitor: curl and Homebrew installers succeeded on ${{ runner.os }}."


  # ============================================================
  # 3) Version endpoint vs GitHub release download URLs
  # ============================================================
  check_version_endpoint:
    needs: check_latest_release
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      error: ${{ steps.version.outputs.error }}
    steps:
      - name: Check version endpoint vs release download URLs
        id: version
        shell: bash
        run: |
          set -euo pipefail
          api_url="https://version.mirrord.dev/v1/version"
          echo "Fetching version from: $api_url"

          retry_opts=(--retry 3 --retry-delay 5 --retry-all-errors --connect-timeout 10 --max-time 30)

          err_file="$(mktemp)"

          # The endpoint returns plain text like: 3.174.0%
          if ! code="$(curl -fsSL "${retry_opts[@]}" -w '%{http_code}' -o /tmp/version.txt "$api_url" 2>"$err_file")"; then
            echo "Failed to fetch $api_url after retries (HTTP ${code:-000})"
            cat "$err_file"
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "error=Failed to fetch $api_url" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "missing_urls=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Raw version.mirrord.dev response:"
          cat /tmp/version.txt || true

          # Strip whitespace and trailing '%' if present
          ver="$(tr -d '\r' < /tmp/version.txt | sed 's/[[:space:]]*$//' | sed 's/%$//')"

          if [ -z "$ver" ]; then
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "error=Empty version string from version.mirrord.dev" >> "$GITHUB_OUTPUT"
            echo "version=" >> "$GITHUB_OUTPUT"
            echo "missing_urls=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Normalized version from API: '$ver'"

          base="https://github.com/metalbear-co/mirrord/releases/download"
          urls=(
            "$base/$ver/mirrord_linux_x86_64"
            "$base/$ver/mirrord_linux_aarch64"
            "$base/$ver/mirrord_mac_universal"
          )

          echo "Checking URLs:"
          printf '  - %s\n' "${urls[@]}"

          missing=()
          for u in "${urls[@]}"; do
            # HEAD to avoid downloading full binaries
            if ! code="$(curl -fsSIL "${retry_opts[@]}" -w '%{http_code}' -o /dev/null "$u" 2>"$err_file")"; then
              echo "URL appears unreachable after retries (HTTP ${code:-000}): $u"
              cat "$err_file"
              missing+=("$u")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Some URLs are missing or unreachable for version $ver:"
            printf '  - %s\n' "${missing[@]}"

            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "error=Download URLs missing or unreachable for version $ver: ${missing[*]}" >> "$GITHUB_OUTPUT"
            printf 'missing_urls=%s\n' "$(IFS=','; echo "${missing[*]}")" >> "$GITHUB_OUTPUT"
          else
            echo "All download URLs for version $ver are reachable."
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "error=" >> "$GITHUB_OUTPUT"
            echo "missing_urls=" >> "$GITHUB_OUTPUT"
          fi

          printf 'version=%s\n' "$ver" >> "$GITHUB_OUTPUT"

      - name: Fail on version API or download errors
        if: steps.version.outputs.ok != 'true'
        run: exit 1

      - name: Log version endpoint success
        if: steps.version.outputs.ok == 'true'
        shell: bash
        run: |
          echo "✅ Version endpoint check passed. version.mirrord.dev -> ${{ steps.version.outputs.version }}"

  # ============================================================
  # 4) Slack alert when the monitor starts failing or recovers
  # ============================================================
  # The previous run's conclusion is the last known status, so a persisting failure alerts
  # once instead of on every run.
  notify:
    needs: [check_latest_release, test_install_paths, check_version_endpoint]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    # A stalled Slack or GitHub API call would otherwise hold up the serialized runs behind it.
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Notify Slack on status change
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NEEDS: ${{ toJSON(needs) }}
          TAG: ${{ needs.check_latest_release.outputs.tag }}
          HTML_URL: ${{ needs.check_latest_release.outputs.html_url }}
          SLACK_PROD_ALERTS_WEBHOOK_URL: ${{ secrets.SLACK_PROD_ALERTS_WEBHOOK_URL }}
        run: |
          # One line per failing check, followed by the error outputs its job exports. A job that
          # reports cancelled while the run itself went on was cut off by its timeout-minutes
          # limit, so a step hung without exporting an error; the line says so instead.
          failed="$(jq -r 'to_entries[] | select(.value.result != "success")
            | ([.value.outputs | to_entries[] | select((.key | startswith("error")) and .value != "") | .value | gsub(" +"; " ")]
               + (if .value.result == "cancelled" then ["a step hung until the job hit its time limit; see the monitor run logs"] else [] end)) as $errors
            | "• \(.key) (\(if .value.result == "cancelled" then "timed out" else .value.result end))\(if $errors == [] then "" else ": " + ($errors | join("; ")) end)"' <<<"$NEEDS")"
          # The last known status is the conclusion of the latest completed main run. A cancelled
          # run counts as a failure only when one of its jobs was cancelled, which means the job
          # was cut off by its timeout-minutes limit (the concurrency group never cancels a run in
          # progress); a run superseded by a newer one while still queued ran no jobs and says
          # nothing about the status. Branch and status are filtered here rather than with
          # --branch/--status: the API's filtered run listing intermittently returns runs that
          # are days old as the latest. One full API page misses the latest completed main run
          # only if 100 newer runs (branch dispatches or superseded runs) were created after it;
          # then previous is empty and a failure still alerts.
          candidates="$(gh run list --workflow releases-test.yaml --limit 100 --json databaseId,headBranch,status,conclusion \
            --jq '.[] | select(.headBranch == "main" and .status == "completed" and (.conclusion == "success" or .conclusion == "failure" or .conclusion == "cancelled")) | "\(.databaseId) \(.conclusion)"')"
          previous=""
          while read -r run_id conclusion; do
            if [ "$conclusion" = cancelled ]; then
              cancelled_jobs="$(gh run view "$run_id" --json jobs --jq '[.jobs[] | select(.conclusion == "cancelled")] | length')"
              if [ "$cancelled_jobs" -eq 0 ]; then
                continue
              fi
              conclusion=failure
            fi
            previous="$conclusion"
            break
          done <<<"$candidates"
          echo "Previous run status: ${previous:-none}"
          links="<$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID|Monitor run logs>${HTML_URL:+ · <$HTML_URL|Release page>}"

          if [ -n "$failed" ] && [ "$previous" != failure ]; then
            text=":rotating_light: *Release monitor FAILURE for \`$GITHUB_REPOSITORY\`* (release \`${TAG:-unknown}\`)
          $failed
          $links"
          elif [ -z "$failed" ] && [ "$previous" = failure ]; then
            text=":white_check_mark: *Release monitor RECOVERED for \`$GITHUB_REPOSITORY\`* (release \`$TAG\`)
          All checks pass.
          $links"
          else
            echo "Status unchanged since the previous run (${previous:-none}); not notifying."
            exit 0
          fi

          curl -fsS --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 -H 'Content-type: application/json' \
            --data "$(jq -n --arg text "$text" '{text: $text}')" "$SLACK_PROD_ALERTS_WEBHOOK_URL"
